name: CI

# Integracao continua: roda a cada Pull Request aberto ou atualizado para a main.
on:
  pull_request:
    branches: [main]

# Permissoes minimas: o workflow apenas le o codigo.
permissions:
  contents: read

# Um novo push no mesmo PR cancela a execucao anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários
        run: npm run test:unit

  integration-tests:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache do binário do MongoDB de teste
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Instalar dependências
        run: npm ci

      - name: Testes de integração
        run: npm run test:integration

  lint:
    name: Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Linter
        run: npm run lint
